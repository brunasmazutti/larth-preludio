<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>LARTH</title>
<script>
  // Redireciona qualquer caminho (ex: larth.com.br/QnJ1bmFf...) de volta
  // para a experiência principal, preservando o código do link.
  // Técnica padrão para sites estáticos de página única no GitHub Pages.
  (function(l) {
    var segmentsToKeep = 0; // 0 = domínio raiz (ex: larth.com.br/CODIGO)
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  }(window.location));
</script>
</head>
<body>
</body>
</html>
